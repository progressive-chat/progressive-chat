# SPDX-License-Identifier: AGPL-3.0-only
name: Setup — Emscripten

description: >-
  The Emscripten SDK, at one pinned revision. Its own clang is what compiles
  the program: it is the only one whose `import std` is read against the
  sysroot a browser is given, and whose `libc++.modules.json` tells CMake
  where that standard library's modules are.

runs:
  using: composite
  steps:
    - name: The SDK, cached whole
      uses: actions/cache@v4
      with:
        path: ~/.cache/pchat-emsdk
        key: pchat-emsdk-6.0.13-${{ runner.os }}-v1

    - name: Install the pinned SDK
      shell: bash
      run: |
        set -euo pipefail
        sdk="$HOME/.cache/pchat-emsdk"
        if [ ! -x "$sdk/emsdk" ]; then
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$sdk"
        fi
        "$sdk/emsdk" install 6.0.13
        "$sdk/emsdk" activate 6.0.13
        echo "$sdk/upstream/emscripten" >> "$GITHUB_PATH"
        echo "$sdk/upstream/bin" >> "$GITHUB_PATH"
        echo "EM_CONFIG=$sdk/.emscripten" >> "$GITHUB_ENV"

    # What the SDK's libc++ is one release short of: `views::enumerate`, read
    # by this tree and by the libraries the window is made of.
    - name: The SDK's libc++, given what libc++ 23 added
      shell: bash
      run: |
        set -euo pipefail
        python3 "${{ github.workspace }}/tools/prepare_emscripten.py" \
          --emscripten "$HOME/.cache/pchat-emsdk/upstream/emscripten" \
          --libcxx /usr/lib/llvm-23/include/c++/v1

    - name: Say the SDK
      shell: bash
      run: |
        emcc --version | head -2
        ls "$HOME/.cache/pchat-emsdk/upstream/bin/clang-scan-deps"
