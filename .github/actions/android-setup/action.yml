# SPDX-License-Identifier: AGPL-3.0-only
name: Setup — an Android toolchain made of this clang

description: >-
  The NDK Android's own builds will not give: `import std` and modules need
  clang 23, and no released NDK has one. So the toolchain is made here, from
  Android's own sources, by the pinned minimal NDK: first its sources are
  resolved to commits, then the headers, the link stubs, the builtins and a
  C++ standard library with its `libc++.modules.json` are built, and what
  comes out is a CMake toolchain file the client is configured with.

inputs:
  abi:
    description: Which ABI to build a toolchain for
    required: false
    default: arm64-v8a
  platform:
    description: The AOSP release every source is resolved through
    required: false
    default: android-14.0.0_r75
  api:
    description: The Android API level the runtimes are built for
    required: false
    default: '28'

runs:
  using: composite
  steps:
    - name: The tool that makes one
      shell: bash
      run: |
        set -euo pipefail
        ABI="${{ inputs.abi }}"
        mkdir -p "$HOME/pchat-tools"
        git clone --depth 1 https://github.com/j4niwzis/minimal-android-ndk.cpp.git \
          "$HOME/pchat-tools/ndk-tool"
        cd "$HOME/pchat-tools/ndk-tool"
        git checkout 517d2f85f613dc07c71b98bad79e424a46e1a4c3
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_COMPILER=clang++-23 \
          -DCMAKE_CXX_FLAGS='-stdlib=libc++'
        cmake --build build --parallel 4

    - name: What packages an APK
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        # aapt2 links the resources and zipalign lines the archive up; the
        # signer is Java, so its javac and jar, and the runtime that runs
        # it, are here too.
        sudo apt-get install -y --no-install-recommends aapt zipalign openjdk-17-jdk-headless
        aapt2 version
        java -version
        javac -version
        # readelf and strip of the very llvm that compiled: what they are
        # asked for is a whole directory of them, on PATH as a whole.
        echo /usr/lib/llvm-23/bin >> "$GITHUB_PATH"
        PATH="/usr/lib/llvm-23/bin:$PATH"
        command -v aapt2 zipalign java javac keytool llvm-readelf llvm-strip

    - name: The activity's classes, written by the fork's own script
      shell: bash
      run: |
        set -euo pipefail
        git init "$HOME/pchat-tools/sdl-dex"
        cd "$HOME/pchat-tools/sdl-dex"
        git remote add origin https://github.com/j4niwzis/SDL.git
        git fetch --depth 1 origin 91c08de87b43fdecc824464fcce15499ccbc7101
        git checkout FETCH_HEAD
        test -f build-scripts/native-activity/dex/CMakeLists.txt

    # This tool's own manifest names one architecture, and says which:
    # 64-bit ARM, and the kernel headers of 64-bit ARM. A 32-bit ARM
    # toolchain is the same sources said the way that architecture spells
    # them, and tools/manifest_abi.py says them so over the tool's copy --
    # the target, and asm-arm for asm-arm64, without which the compiler's
    # own builtins do not compile and there is no toolchain at all.
    - name: The manifest, said for this ABI
      shell: bash
      run: |
        set -euo pipefail
        python3 "${{ github.workspace }}/tools/manifest_abi.py" \
          --manifest "$HOME/pchat-tools/ndk-tool/manifest/sources.json" \
          --abi "${{ inputs.abi }}" \
          --out "$HOME/pchat-tools/manifest-${{ inputs.abi }}.json"

    - name: Every source at its commit
      shell: bash
      run: |
        set -euo pipefail
        "$HOME/pchat-tools/ndk-tool/build/minimal-android-ndk" \
          --root "$HOME/.cache/pchat-android-${{ inputs.abi }}" \
          --build-root "$HOME/pchat-tools/ndk-${{ inputs.abi }}" \
          --manifest "$HOME/pchat-tools/manifest-${{ inputs.abi }}.json" \
          pin --platform "${{ inputs.platform }}"

    - name: Headers, stubs, builtins and the C++ standard library
      shell: bash
      run: |
        set -euo pipefail
        "$HOME/pchat-tools/ndk-tool/build/minimal-android-ndk" \
          --root "$HOME/.cache/pchat-android-${{ inputs.abi }}" \
          --build-root "$HOME/pchat-tools/ndk-${{ inputs.abi }}" \
          --manifest "$HOME/pchat-tools/manifest-${{ inputs.abi }}.json" \
          --clang /usr/lib/llvm-23/bin/clang \
          --llvm-bin /usr/lib/llvm-23/bin \
          --api ${{ inputs.api }} \
          --jobs 4 \
          build runtimes toolchain-file framework-res apksigner

    - name: A whole sysroot, and what packages an APK, or nothing cached
      shell: bash
      run: |
        set -euo pipefail
        root="$HOME/.cache/pchat-android-${{ inputs.abi }}"
        test -f "$root/cmake/target.cmake"
        test -f "$root/sysroot/usr/lib/libc++.modules.json"
        test -f "$root/tools/framework-res.apk"
        test -f "$root/tools/apksigner.jar"
        find "$root" -exec touch -h -d "@1000000000" {} +

    # This tree is read by clang 23 against a libc++ of AOSP's, which is one
    # release behind: given what that clang already gives the host's own.
    - name: The sysroot's libc++, given what libc++ 23 added
      shell: bash
      run: |
        set -euo pipefail
        python3 "${{ github.workspace }}/tools/prepare_libcxx.py" \
          --libcxx /usr/lib/llvm-23/include/c++/v1 \
          --tree "$HOME/.cache/pchat-android-${{ inputs.abi }}/sysroot/usr/include/c++/v1"

    - name: Say the toolchain
      shell: bash
      run: |
        ls "$HOME/.cache/pchat-android-${{ inputs.abi }}/cmake"
