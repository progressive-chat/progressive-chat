# SPDX-License-Identifier: AGPL-3.0-only
name: Setup -- clang 23, CMake 4, Ninja, gn

description: >-
  The toolchain a build of progressive-chat has to have: clang 23 with its
  libc++ (there is no other way to `import std` here), CMake 4.3.4 or newer,
  Ninja, which is the only generator CMake scans modules under, and gn, which
  is what Skia itself is built with. Both machines a Linux runs on are
  given their own, because neither a CMake nor a gn built for one will
  execute on the other.

runs:
  using: composite
  steps:
    - name: clang 23
      shell: bash
      run: |
        set -euo pipefail
        codename="$(. /etc/os-release && echo "${UBUNTU_CODENAME:-noble}")"
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
          | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
        echo "deb http://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-23 main" \
          | sudo tee /etc/apt/sources.list.d/llvm23.list
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          clang-23 lld-23 libc++-23-dev libc++abi-23-dev llvm-23 ninja-build python3
        # The runner's own clang is a file in /usr/bin, not an alternative:
        # taken out of the way, so that the links below are what every step
        # finds -- an alternative installed beside a file is not the one used.
        sudo rm -f /usr/bin/clang /usr/bin/clang++ /usr/bin/llvm-config /usr/bin/clang-scan-deps
        for tool in clang clang++ llvm-config clang-scan-deps; do
          sudo ln -sf "/usr/lib/llvm-23/bin/${tool}" "/usr/bin/${tool}"
        done
        clang++ --version

    # What the window is made through: X11, Wayland and the GL that draws
    # into them. SDL3 will not configure -- and so will not be found -- on a
    # machine that has none of them, even though nothing here is shown.
    - name: SDL3's own
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
          libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libdbus-1-dev libudev-dev \
          libgl1-mesa-dev libegl1-mesa-dev libasound2-dev libpulse-dev

    # A download asked for again at every run is asked for again of a machine
    # that says no often enough to be noticed: a 504 out of Kitware's own
    # releases took the whole of a build for one phone out of three, and
    # nothing about the build was wrong. So: kept between runs, and where it
    # has to be asked for, asked again rather than once.
    - name: What is kept of the toolchain
      uses: actions/cache@v4
      with:
        path: ~/.cache/pchat-toolchain
        key: toolchain-${{ runner.arch }}-cmake-4.4.4-gn

    - name: CMake 4
      shell: bash
      run: |
        set -euo pipefail
        cd /tmp
        # Kept for both machines: CMake names them as the uname does, which
        # is x86_64 on one and aarch64 on the other.
        case "$(uname -m)" in
          x86_64) machine=x86_64 ;;
          aarch64) machine=aarch64 ;;
          *) echo "no CMake is kept for $(uname -m)"; exit 1 ;;
        esac
        # Not under /opt, where nothing can be written but through sudo and
        # nothing that was kept can be brought back: here instead, where a
        # cache owns it.
        kept="$HOME/.cache/pchat-toolchain"
        mkdir -p "$kept"
        if [ ! -x "$kept/cmake-4.4.4-linux-${machine}/bin/cmake" ]; then
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
            -o cmake.tar.gz \
            "https://github.com/Kitware/CMake/releases/download/v4.4.4/cmake-4.4.4-linux-${machine}.tar.gz"
          tar xzf cmake.tar.gz -C "$kept"
        fi
        sudo ln -sf "$kept/cmake-4.4.4-linux-${machine}/bin/cmake" /usr/local/bin/cmake
        sudo ln -sf "$kept/cmake-4.4.4-linux-${machine}/bin/ctest" /usr/local/bin/ctest

    # Skia is a GN project: gn is what turns its BUILD.gn files into ninja
    # rules. No distribution keeps a release of it, so it comes from
    # Chromium's own package store, as the latest one there.
    - name: gn
      shell: bash
      run: |
        set -euo pipefail
        cd /tmp
        # Chromium's own name for each machine, which is not the uname's.
        case "$(uname -m)" in
          x86_64) machine=linux-amd64 ;;
          aarch64) machine=linux-arm64 ;;
          *) echo "no gn is kept for $(uname -m)"; exit 1 ;;
        esac
        kept="$HOME/.cache/pchat-toolchain"
        mkdir -p "$kept"
        if [ ! -x "$kept/gn-${machine}" ]; then
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
            -o gn.zip "https://chrome-infra-packages.appspot.com/dl/gn/gn/${machine}/+/latest"
          python3 -c "import zipfile; zipfile.ZipFile('gn.zip').extract('gn', 'gn-unpacked')"
          install -m 755 gn-unpacked/gn "$kept/gn-${machine}"
        fi
        sudo ln -sf "$kept/gn-${machine}" /usr/local/bin/gn
        gn --version

    - name: Say the toolchain
      shell: bash
      run: |
        clang++ --version
        cmake --version
        ninja --version
        gn --version
