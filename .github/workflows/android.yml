# SPDX-License-Identifier: AGPL-3.0-only
name: android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}-${{ inputs.abi || 'arm64-v8a' }}
  cancel-in-progress: false

permissions:
  contents: read

# The same program, as a library an Android activity loads. It is built with
# a toolchain of this clang rather than Android's own, because only this clang
# reads C++26 modules; making that toolchain takes long enough that pushing
# to main builds one ABI only.
jobs:
  library:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/desktop-setup
      - uses: ./.github/actions/android-setup
        with:
          abi: ${{ inputs.abi || 'arm64-v8a' }}
      - uses: actions/cache@v4
        with:
          path: build-android
          key: android-${{ inputs.abi || 'arm64-v8a' }}-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake', '.github/workflows/android.yml') }}
      - name: Configure
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$HOME/.cache/pchat-android-${{ inputs.abi || 'arm64-v8a' }}/cmake/target.cmake" \
            -DANDROID_ABI=${{ inputs.abi || 'arm64-v8a' }} \
            -DANDROID_PLATFORM=android-28 \
            -DPCHAT_TESTS=OFF
      - name: Build
        run: cmake --build build-android --target progressive-chat -- -k 0
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: progressive-chat-android-${{ inputs.abi || 'arm64-v8a' }}-${{ github.sha }}
          path: build-android/libprogressive-chat.so
          if-no-files-found: error
