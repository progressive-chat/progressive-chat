# SPDX-License-Identifier: AGPL-3.0-only
name: android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The same program, as a library an Android activity loads. It is built with
# a toolchain of this clang rather than Android's own, because only this clang
# reads C++26 modules; making that toolchain takes long enough that the two
# ABIs are built beside each other rather than one after the other.
#
# Built as a release: this library is loaded by an activity that is given no
# time to load it in, and everything it does before its first frame -- Skia
# and HarfBuzz both, which a debug build leaves unoptimized and full of
# checking -- is done while the screen is still black.
jobs:
  library:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    # One ABI does not take the other with it: each keeps its own line of
    # builds, and neither's own wait is cancelled by the other's.
    concurrency:
      group: android-${{ github.ref }}-${{ matrix.abi }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        # What a phone today is: 64-bit ARM, and the 32-bit ARM a great
        # many still are -- one APK for each. What 32-bit ARM needs that
        # 64-bit ARM does not is said by tools/manifest_abi.py, over the
        # toolchain's own manifest.
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/desktop-setup
      - uses: ./.github/actions/android-setup
        with:
          abi: ${{ matrix.abi }}
      - uses: actions/cache@v4
        # The 32-bit line's key is not the one it had: a build of its own
        # was once kept from a toolchain made of 64-bit ARM's kernel
        # headers, which is not a build anything should go on from.
        with:
          path: build-android
          key: android-${{ matrix.abi }}-${{ runner.os }}-${{ matrix.abi == 'armeabi-v7a' && 'asm-arm-' || '' }}${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake', '.github/workflows/android.yml') }}
      - name: Configure
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS_RELEASE="-O2 -g0" \
            -DCMAKE_C_FLAGS_RELEASE="-O2 -g0" \
            -DCMAKE_TOOLCHAIN_FILE="$HOME/.cache/pchat-android-${{ matrix.abi }}/cmake/target.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-28 \
            -DPCHAT_ANDROID_SDL_DEX_DIR="$HOME/pchat-tools/sdl-dex/build-scripts/native-activity/dex" \
            -DPCHAT_TESTS=OFF
      - name: Build
        run: cmake --build build-android --target progressive-chat -- -k 0
      # The same library, packaged: resources against the platform's own, the
      # activity's classes, the archive lined up and signed. Both APKs are
      # named with the version and commit they are of, so that one taken out
      # of here and of the archive around it still says which build it came
      # from.
      - name: Package
        run: cmake --build build-android --target progressive-chat-apk-out
      # What installs goes up alone: three files in one artifact -- the
      # signed APK, the unsigned one beside it, the symbols -- is three to
      # choose between, and the wrong one of them is what an Android means
      # by "there was a problem while parsing the package".
      # What the APK made here is called -- its version, its commit and the
      # machine it runs on -- said once, so that what goes up is named as
      # what it holds.
      - name: Say what it is called
        id: called
        run: |
          version="$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build-android/CMakeCache.txt)"
          commit="$(git rev-parse --short=12 HEAD)"
          echo "name=progressive-chat-${version}-${commit}-${{ matrix.abi }}" >> "$GITHUB_OUTPUT"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.called.outputs.name }}
          path: |
            build-android/progressive-chat-*-${{ matrix.abi }}.apk
            !build-android/progressive-chat-*-${{ matrix.abi }}-unsigned.apk
          if-no-files-found: error
      # The rest of what came out, under its own name: what no Android
      # installs, and what a symbolizer reads.
      - name: Upload the rest
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.called.outputs.name }}-unsigned-and-symbols
          path: |
            build-android/progressive-chat-*-${{ matrix.abi }}-unsigned.apk
            build-android/libprogressive-chat.so
          if-no-files-found: error
