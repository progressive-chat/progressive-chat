# SPDX-License-Identifier: AGPL-3.0-only
name: android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The same program, as a library an Android activity loads. It is built with
# a toolchain of this clang rather than Android's own, because only this clang
# reads C++26 modules. One ABI, and one line of builds for it.
jobs:
  library:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    # No wait of this ABI is cancelled by another run's: one line, kept.
    concurrency:
      group: android-${{ github.ref }}-${{ matrix.abi }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        # What a phone today is: 64-bit ARM. 32-bit ARM is not here, not
        # for want of wanting it: bionic's own kernel headers give
        # asm/sigcontext.h a field of a type clang 23 has no name for on a
        # 32-bit target, and compiler-rt's builtins -- needed before there
        # is a libc++ at all -- do not get compiled. The tool that makes
        # the toolchain does not come to what would have to be patched
        # around it, and patching a header of the platform's own into every
        # build is not a thing worth keeping in this repository: one ABI,
        # built well, rather than two of which one only ever fails.
        abi: [arm64-v8a]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/desktop-setup
      - uses: ./.github/actions/android-setup
        with:
          abi: ${{ matrix.abi }}
      - uses: actions/cache@v4
        with:
          path: build-android
          key: android-${{ matrix.abi }}-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake', '.github/workflows/android.yml') }}
      - name: Configure
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$HOME/.cache/pchat-android-${{ matrix.abi }}/cmake/target.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-28 \
            -DPCHAT_ANDROID_SDL_DEX_DIR="$HOME/pchat-tools/sdl-dex/build-scripts/native-activity/dex" \
            -DPCHAT_TESTS=OFF
      - name: Build
        run: cmake --build build-android --target progressive-chat -- -k 0
      # The same library, packaged: resources against the platform's own, the
      # activity's classes, the archive lined up and signed. Both APKs are
      # named with the commit they are of, so that one taken out of here and
      # of the archive around it still says which build it came from.
      - name: Package
        run: cmake --build build-android --target progressive-chat-apk-out
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: progressive-chat-android-${{ matrix.abi }}-${{ github.sha }}
          path: |
            build-android/progressive-chat-${{ matrix.abi }}-*.apk
            build-android/libprogressive-chat.so
          if-no-files-found: error
