# SPDX-License-Identifier: AGPL-3.0-only
name: web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

# The same program, for a browser: Emscripten compiles it, and GitHub Pages
# serves it. Pages sets no headers of its own, so cross-origin isolation --
# which shared memory needs -- is not available, and this build is asked for
# no threads.
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/desktop-setup
      - uses: ./.github/actions/web-setup
      # CMake asks the compiler where its standard library's modules are;
      # em++ is a driver rather than a clang, and answers nothing. So the
      # file is looked for in the sysroot it will read them from instead.
      - name: Where the standard library's modules are
        run: |
          set -euo pipefail
          json="$(em++ -print-file-name=libc++.modules.json 2>/dev/null || true)"
          if [ ! -f "$json" ]; then
            json="$(find "$HOME/.cache/pchat-emsdk/upstream/emscripten/cache/sysroot" \
              -name 'libc++.modules.json' -print -quit 2>/dev/null || true)"
          fi
          if [ ! -f "$json" ]; then
            echo "::error::no libc++.modules.json came with this SDK"
            exit 1
          fi
          echo "found $json"
          echo "PCHAT_MODULES_JSON=$json" >> "$GITHUB_ENV"
      - name: Configure
        run: |
          emcmake cmake -S . -B build-web -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS_DEBUG="-Os -g0" \
            -DCMAKE_C_FLAGS_DEBUG="-Os -g0" \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++ -fexceptions" \
            -DCMAKE_CXX_STDLIB_MODULES_JSON="$PCHAT_MODULES_JSON" \
            -DCMAKE_CXX_COMPILER_CLANG_SCAN_DEPS="$HOME/.cache/pchat-emsdk/upstream/bin/clang-scan-deps" \
            -DPCHAT_TESTS=OFF
      - name: Build
        run: cmake --build build-web --target progressive-chat -- -k 0
      - name: Say how big it came out
        run: ls -l build-web/*.wasm build-web/*.js 2>/dev/null || true
      - name: Upload the page
        uses: actions/upload-pages-artifact@v4
        with:
          path: build-web/web

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
