# SPDX-License-Identifier: AGPL-3.0-only
name: probe

# Only ever asked for by hand: what the deployed page paints is not what a
# push changes, and a browser takes its minutes here for nothing if every
# push pays them.
on:
  workflow_dispatch:
    inputs:
      # What to say to the page instead of what the tester says every time: a
      # whole script, written here and run instead of tools/probe_painted.mjs,
      # so that one question can be asked of the page without a push and
      # without waiting for it to be built again.
      script:
        description: 'A probe script, in place of the one in the tree'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  painted:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: A browser that can be driven
        run: |
          npm init -y
          # Said of a version and not "the newest": a playwright is put out
          # before the core it is said on top of, and a probe that cannot be
          # installed is no probe at all -- this one is moved on by hand when
          # the next is settled.
          npm install playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: What to say to the page, when it is said by hand
        if: ${{ github.event.inputs.script != '' }}
        run: printf '%s' "${{ github.event.inputs.script }}" > said_by_hand.mjs
      - name: Shoot the page
        run: node ${{ github.event.inputs.script != '' && 'said_by_hand.mjs' || 'tools/probe_painted.mjs' }}
      - uses: actions/upload-artifact@v4
        with:
          name: painted
          path: |
            painted-wide.png
            painted-narrow.png
            painted-answering.png
            painted-tools.png
          if-no-files-found: error
