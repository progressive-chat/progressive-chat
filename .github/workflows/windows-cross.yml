# SPDX-License-Identifier: AGPL-3.0-only
name: windows-cross

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/windows-cross.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/windows-cross.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install mingw-w64, clang 23, lld, CMake 4.x
        run: |
          sudo apt-get update -qq
          # Add LLVM apt repository for clang 23 / lld 23
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm23.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64 llvm-23 lld-23 clang-23
          
          # Install CMake 4.3.4+ from GitHub release
          CMAKE_VERSION="4.0.3"
          wget -q "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz" -O /tmp/cmake.tar.gz
          sudo tar -xzf /tmp/cmake.tar.gz -C /opt
          sudo ln -sf /opt/cmake-${CMAKE_VERSION}-linux-x86_64/bin/cmake /usr/local/bin/cmake
          sudo ln -sf /opt/cmake-${CMAKE_VERSION}-linux-x86_64/bin/ctest /usr/local/bin/ctest
          sudo ln -sf /opt/cmake-${CMAKE_VERSION}-linux-x86_64/bin/cpack /usr/local/bin/cpack
          
          # Install mingw and clang
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64 llvm-23 lld-23 clang-23
          
          # Verify installation
          which clang-23
          clang-23 --version
          cmake --version
          x86_64-w64-mingw32-gcc --version || true

      - name: Configure (Windows cross-compile)
        run: |
          cmake -S . -B build-windows -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/windows-toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DPCHAT_GL=OFF \
            -DPCHAT_UI=ON \
            -DPCHAT_TESTS=OFF

      - name: Build progressive-chat.exe
        run: |
          cmake --build build-windows --target progressive-chat -v

      - name: Verify executable
        run: |
          file build-windows/progressive-chat.exe
          ls -lh build-windows/progressive-chat.exe

      - name: Collect DLLs
        run: |
          mkdir -p dist-windows
          cp build-windows/progressive-chat.exe dist-windows/
          # mingw runtime DLLs
          cp /usr/x86_64-w64-mingw32/bin/libstdc++-6.dll dist-windows/ 2>/dev/null || true
          cp /usr/x86_64-w64-mingw32/bin/libgcc_s_seh-1.dll dist-windows/ 2>/dev/null || true
          cp /usr/x86_64-w64-mingw32/bin/libwinpthread-1.dll dist-windows/ 2>/dev/null || true
          # SDL3.dll if built shared (should be static per config)
          find build-windows -name "*.dll" -exec cp {} dist-windows/ \; 2>/dev/null || true

      - name: Create portable zip
        run: |
          cd dist-windows
          zip -r ../progressive-chat-windows.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: progressive-chat-windows
          path: progressive-chat-windows.zip
          retention-days: 7

      - name: Wine smoke test (optional)
        run: |
          sudo apt-get install -y -qq wine64 xvfb
          cd dist-windows
          # Just check it starts and exits (no display)
          timeout 10s xvfb-run -a wine progressive-chat.exe --help 2>&1 | head -20 || true
          echo "Wine test completed (exit code ignored)"

