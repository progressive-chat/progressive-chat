# SPDX-License-Identifier: AGPL-3.0-only
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# One machine, four steps of the same build, each having the one before it:
# the model's modules, then the tests that read them, then the program that
# draws them. One job, because Skia is built once here and once in every job
# that needs it -- and 'every job' is a machine of its own.
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/desktop-setup
      # Skia and SDL3 are built here, and only here: kept between runs, so
      # that a check is the program's own build and nothing else.
      - uses: actions/cache@v4
        with:
          path: build
          key: check-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake', '.github/workflows/check.yml', '.github/actions/desktop-setup/action.yml') }}
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS_DEBUG='-O3 -g0' \
            -DCMAKE_C_FLAGS_DEBUG='-O3 -g0' \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
            -DPCHAT_TESTS=ON
      - name: Build the model's modules
        run: cmake --build build --target pchat_core --parallel 4
      - name: Build and run the tests
        run: |
          cmake --build build --target pchat-tests --parallel 4
          ctest --test-dir build --output-on-failure
      - name: Build the window and the program
        run: cmake --build build --target progressive-chat --parallel 4

  tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: No license left unsaid
        run: |
          # Every file this program is made of says its license in itself.
          # The one thing left out of that is the golden traces a ported tree
          # came with: those are the data another build was measured against,
          # and a line put above one would make it say something else than
          # what it was recorded from.
          missing=$(git ls-files '*.cc' '*.cmake' '*.txt' 'CMakeLists.txt' '*.yml' \
            ':(exclude)ports/*/tools/golden/*' \
            | xargs grep -L "SPDX-License-Identifier" || true)
          if [ -n "$missing" ]; then
            echo "These files say no license:"
            echo "$missing"
            exit 1
          fi

      - name: The names of Agora, counted
        run: |
          # How much of the ported tree stands here, counted by spelling --
          # through what the two sides call the same thing where they call
          # it differently (docs/agora-bridge.md). The floor is what stood
          # when this step was written: a carried thing going missing under
          # it fails the check, and a carried thing arriving raises it for
          # the next hand to set.
          python3 tools/agora_coverage.py --min 79
