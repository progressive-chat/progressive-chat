# SPDX-License-Identifier: AGPL-3.0-only
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# One machine, four steps of the same build, each having the one before it:
# the model's modules, then the tests that read them, then the program that
# draws them. One job, because Skia is built once here and once in every job
# that needs it -- and 'every job' is a machine of its own.
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/desktop-setup
      # Skia and SDL3 are built here, and only here: kept between runs, so
      # that a check is the program's own build and nothing else.
      - uses: actions/cache@v4
        with:
          path: build
          key: check-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake', '.github/workflows/check.yml', '.github/actions/desktop-setup/action.yml') }}
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS_DEBUG='-O3 -g0' \
            -DCMAKE_C_FLAGS_DEBUG='-O3 -g0' \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
            -DPCHAT_TESTS=ON
      - name: Build the model's modules
        run: cmake --build build --target pchat_core --parallel 4
      - name: Build and run the tests
        run: |
          cmake --build build --target pchat-tests --parallel 4
          ctest --test-dir build --output-on-failure
      - name: Build the window and the program
        run: cmake --build build --target progressive-chat --parallel 4

  tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: No license left unsaid
        run: |
          # Every file this program is made of says its license in itself.
          # The one thing left out of that is the golden traces a ported tree
          # came with: those are the data another build was measured against,
          # and a line put above one would make it say something else than
          # what it was recorded from.
          missing=$(git ls-files '*.cc' '*.cmake' '*.txt' 'CMakeLists.txt' '*.yml' \
            ':(exclude)ports/*/tools/golden/*' \
            | xargs grep -L "SPDX-License-Identifier" || true)
          if [ -n "$missing" ]; then
            echo "These files say no license:"
            echo "$missing"
            exit 1
          fi
      - name: No name written as a sentence
        run: |
          # A name says what a thing is, in four words at most: a sentence
          # given to a name reads as prose, and nothing is gained by it.
          # Only what is written here is asked about -- the names a build
          # came with keep the shape they were given -- and what is inside
          # a string is not a name, so strings are read as though empty.
          long=$(git ls-files 'src/*.cc' 'src/*/*.cc' \
            | xargs sed -E 's/"[^"]*"//g' \
            | grep -ohE '\b[a-z_][a-z0-9_]*(_[a-z0-9]+){4,}\b' | sort -u || true)
          if [ -n "$long" ]; then
            echo "These names are sentences, and are to be said in four words:"
            echo "$long"
            exit 1
          fi
      - name: No prose a comment is not
        run: |
          # A comment says the fact and nothing around it. The connectors this
          # rule bans -- "whatever", "so that", "of its own", "where there is",
          # "said once", "as it were", "not a thing" -- are the shape of a
          # sentence written for its own sound. A string is what a screen says,
          # so strings are read as empty, and CODE_STYLE.md quotes the ban in
          # the rule that gives it, so it is left out.
          hits=$(git ls-files 'src/*.cc' 'src/*/*.cc' 'src/*.h' 'src/*.cpp' \
                   'src/*/*.h' 'src/*/*.cpp' \
                 | xargs sed -E 's/"[^"]*"//g' \
                 | grep -nE 'whatever |so that |of its own|where there is|said once|as it were|not a thing' || true)
          # switches.md quotes a screen's label in its first column -- what a
          # screen says, not prose -- so that column is taken out before the
          # rest of the line is read.
          doc=$(grep -niE 'whatever |so that |of its own|where there is|said once|as it were|not a thing' \
                  README.md TODO.md design-doc.md docs/README.md || true)
          switches=$(sed -E 's/^\|[^|]*\|//' docs/switches.md \
                     | grep -niE 'whatever |so that |of its own|where there is|said once|as it were|not a thing' || true)
          if [ -n "$hits" ] || [ -n "$doc" ] || [ -n "$switches" ]; then
            echo "These lines write a comment as prose:"
            echo "$hits"
            echo "$doc"
            echo "$switches"
            exit 1
          fi
      - name: A name the ported tree already has
        run: |
          # A name this tree chose for itself where Agora already spells the
          # same thing: the frames' fields, the endpoint's base, the prompt a
          # model is told. Agora says id, name, arguments, input_tokens,
          # output_tokens, text, stop_reason, base_url, system_prompt,
          # description. Where a name here was one of ours, the ported tree's
          # spelling is the one kept -- so the old spelling, as a field or a
          # member, is asked to be gone. A word that is still right elsewhere
          # (a chip that says told, a variable that holds one) is not a field
          # named that, and is left alone.
          old_fields=$(grep -rnE 'std::string (told|base);' src \
                         --include='*.cc' --include='*.h' || true)
          old_members=$(grep -rnE '\b(call_arguments|call_name|used_in|used_out|input_tokens|output_tokens)\b' src \
                          --include='*.cc' --include='*.h' --include='*.cpp' || true)
          if [ -n "$old_fields" ] || [ -n "$old_members" ]; then
            echo "These names say what the ported tree says another way:"
            echo "$old_fields"
            echo "$old_members"
            exit 1
          fi
      - name: How much of the ported tree this program speaks
        run: |
          # Said every run, and asked of nothing: how many of Agora's headers
          # this program names, and how many of the names in them it calls.
          # The number moves only where a part of the ported tree is taken
          # over for real -- a header included because the program reads it,
          # a name called because the program does something with it -- so it
          # is written down here to be seen, not to be kept at some height.
          headers=$(grep -rho '#include "agora/[^"]*"' src | sort -u | wc -l)
          names=$(grep -rhoE '\b(agora::core::[a-z_:]+|as::[a-z_]+|gs::[a-z_]+|sn::[a-z_]+|zip::[a-z_]+)[a-zA-Z_:]*' src | sort -u | wc -l)
          echo "Agora headers this program includes: $headers"
          echo "Agora names this program calls:      $names"
