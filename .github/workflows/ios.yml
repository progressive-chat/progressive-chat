# SPDX-License-Identifier: AGPL-3.0-only
name: ios

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

# Everything is built on a machine that is not a phone and not a Mac: the
# app is compiled and linked on Linux, against an SDK the Mac job hands it.
# The compiler there is the project's clang 23, and the standard library is
# asked for the phone's target, module and all. The Mac job then only puts
# what Linux made into a simulator and asks whether it came up. What it looked
# like is kept as a picture, because a log can say a window exists while the
# screen stays black.
jobs:
  sdk:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Take the simulator SDK out of Xcode
        run: |
          mkdir -p sdk
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-path)
          # What xcrun names is a link to what the SDK is: a link is all
          # that would be archived, and on another machine it points nowhere.
          sdk=$(cd "$sdk" && pwd -P)
          echo "sdk: $sdk"
          du -sh "$sdk"
          # The Mac is not asked to build anything: it hands over the one
          # thing Linux cannot get on its own, the SDK the simulator runs
          # against. The device SDK is not enough: its libraries name other
          # targets, and a simulator binary linked against them is not one.
          tar -C "$(dirname "$sdk")" -czf sdk/iPhoneSimulator.sdk.tar.gz \
            "$(basename "$sdk")"
          du -sh sdk/iPhoneSimulator.sdk.tar.gz

      - name: Hand it to the build
        uses: actions/upload-artifact@v4
        with:
          name: iphonesimulator-sdk
          path: sdk/iPhoneSimulator.sdk.tar.gz
          retention-days: 7

  build:
    needs: sdk
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Take the SDK
        uses: actions/download-artifact@v4
        with:
          name: iphonesimulator-sdk
          path: sdk

      - name: Put clang 23 and the Mach-O linker there
        run: |
          codename="$(. /etc/os-release && echo "${UBUNTU_CODENAME:-noble}")"
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm23.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            clang-23 lld-23 libc++-23-dev libc++abi-23-dev
          clang++-23 --version
          # The package owns the versioned name; the name clang looks for is
          # a link that only a system with alternatives installed makes.
          sudo ln -sf /usr/bin/ld64.lld-23 /usr/local/bin/ld64.lld
          command -v ld64.lld

      - name: Build it, and link it, here
        run: |
          mkdir -p build
          tar -C sdk --warning=no-unknown-keyword -xzf sdk/iPhoneSimulator.sdk.tar.gz
          sysroot=$(find "$PWD/sdk" -maxdepth 1 -name 'iPhoneSimulator*.sdk' -print -quit)
          echo "sysroot: $sysroot"
          libcxx=/usr/lib/llvm-23
          # The headers and the source of std are clang 23's; the target they
          # are compiled for is a phone, not this machine. The library the
          # program will call at run time is the one in the simulator.
          clang++-23 \
            --target=arm64-apple-ios26.0-simulator \
            -std=c++23 \
            -isysroot "$sysroot" \
            -nostdinc++ -isystem "$libcxx/include/c++/v1" \
            --precompile "$libcxx/share/libc++/v1/std.cppm" \
            -o build/std.pcm
          app=build/first-run.app
          mkdir -p "$app"
          clang++-23 \
            --target=arm64-apple-ios26.0-simulator \
            -std=c++23 -x objective-c++ -fobjc-arc \
            -isysroot "$sysroot" \
            -nostdinc++ -isystem "$libcxx/include/c++/v1" \
            -fmodule-file=std=build/std.pcm \
            -F "$sysroot/System/Library/Frameworks" \
            -F "$sysroot/System/Library/SubFrameworks" \
            -F "$sysroot/System/Library/PrivateFrameworks" \
            -fuse-ld=lld \
            -framework UIKit -framework Foundation \
            -o "$app/first-run" ios/first-run/main.mm
          cp ios/first-run/Info.plist "$app/Info.plist"
          file "$app/first-run"

      - name: Hand it to the phone's system
        uses: actions/upload-artifact@v4
        with:
          name: first-run-app
          path: build/first-run.app
          retention-days: 7

  run:
    needs: build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Take what Linux built
        uses: actions/download-artifact@v4
        with:
          name: first-run-app
          path: build/first-run.app

      - name: Sign it as the simulator asks
        run: |
          # A simulator takes an unsigned bundle, but the system asks every
          # Mach-O it loads for a signature, and signs an empty one over it.
          codesign --force --sign - build/first-run.app
          codesign --verify --verbose build/first-run.app || true

      - name: Boot a simulator and install it
        run: |
          runtime=$(xcrun simctl list runtimes -j \
            | jq -r '[.runtimes[] | select(.isAvailable and (.identifier | contains("iOS")))] | first | .identifier')
          device=$(xcrun simctl list devicetypes -j \
            | jq -r '[.devicetypes[] | select(.identifier | contains("iPhone"))] | first | .identifier')
          echo "runtime: $runtime"
          echo "device:  $device"
          udid=$(xcrun simctl create first-run "$device" "$runtime")
          echo "udid:    $udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" build/first-run.app
          echo "udid=$udid" >> "$GITHUB_ENV"

      - name: Launch it, and hear what it says
        run: |
          xcrun simctl launch "$udid" chat.progressive.first-run | tee build/launch.log
          # Long enough for the first frame on a machine that boots cold.
          sleep 8
          xcrun simctl io "$udid" screenshot build/first-run.png
          # NSLog writes to the system's own log, not to the launch's stdout:
          # the app is asked there, by name, for the line it wrote.
          xcrun simctl spawn "$udid" log show --last 3m --style compact \
            --predicate 'process == "first-run"' > build/system.log
          if ! grep -q "PCHAT-IOS-FIRST-RUN: the window is up" build/system.log; then
            echo "::error::the app never said its window came up"
            tail -50 build/system.log
            exit 1
          fi
          # A line in the log can outlive the process that wrote it: the app
          # is asked, after the fact, whether it is still on the machine's list.
          if ! xcrun simctl spawn "$udid" launchctl list | grep -q chat.progressive.first-run; then
            echo "::error::the app said its window came up and then died"
            exit 1
          fi

      - name: Keep what it looked like
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-run
          path: |
            build/first-run.png
            build/launch.log
            build/system.log
          if-no-files-found: warn
