<!--
  The page progressive-chat is drawn into: an element of its own -- #skiff,
  which skiff.platform.browser writes the program's tree into -- and the
  bootstrap that isolates the page and loads the client (web/bootstrap.js).

  Isolation is what the client is built to need: it is linked with threads,
  and threads need shared memory, which a browser gives a page only where it
  is cross-origin isolated. GitHub Pages sets no headers, so a service
  worker -- web/worker.js -- answers with the ones isolation asks for.
-->
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0c160c" />
  <title>progressive-chat</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <style>
    html,
    body,
    #skiff {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    body {
      background: #0c160c;
      color: #dee6dc;
      font: 15px system-ui, sans-serif;
    }
    #waiting {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }
  </style>
  <div id="waiting" role="status">Starting progressive-chat…</div>
  <div id="skiff"></div>
  <script src="./bootstrap.js"></script>
</html>
